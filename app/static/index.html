<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm công (demo)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Chấm công</h1><div id="who" hidden><span id="who-name"></span> <button id="logout" class="link">Đăng xuất</button></div></header>
<main>
  <p id="msg" role="status" hidden></p>

  <section id="login-view" hidden>
    <h2>Đăng nhập</h2>
    <form id="login-form">
      <label>Mã nhân viên <input id="code" autocomplete="username" required></label>
      <label>Mật khẩu <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Đăng nhập</button>
    </form>
  </section>

  <div id="app-view" hidden>
    <section>
      <button id="check" class="big">Chấm công</button>
      <p id="check-result" class="muted"></p>
      <p id="outbox" class="muted" hidden></p>
    </section>

    <section>
      <h2>Công của tôi</h2>
      <table><thead><tr><th>Ngày</th><th>Vào</th><th>Ra</th><th>Phút</th><th>OT</th></tr></thead><tbody id="daily"></tbody></table>
    </section>

    <section>
      <h2>Tạo đơn</h2>
      <form id="req-form">
        <label>Loại
          <select id="req-type"><option value="leave">Nghỉ phép</option><option value="adjustment">Sửa công</option><option value="ot">Làm thêm giờ (OT)</option></select>
        </label>
        <label>Ngày <input id="req-date" type="date" required></label>
        <div class="row">
          <label>Từ <input id="req-start" type="time"></label>
          <label>Đến <input id="req-end" type="time"></label>
        </div>
        <label>Lý do <input id="req-reason" maxlength="500"></label>
        <button type="submit">Gửi đơn</button>
      </form>
      <h3>Đơn của tôi</h3>
      <ul id="my-requests" class="cards"></ul>
    </section>

    <section id="approve-view" hidden>
      <h2>Đơn chờ duyệt</h2>
      <ul id="pending" class="cards"></ul>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
