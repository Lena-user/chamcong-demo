name: chamcong

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  TEST_DATABASE_URL: ${TEST_DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  SEED_PASSWORD: ${SEED_PASSWORD}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}

services:
  db:
    image: postgres:16
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1GB
      -c max_connections=100
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 2G }

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  api:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  worker:
    build: .
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  tunnel:
    image: cloudflare/cloudflared
    command: tunnel --no-autoupdate --url http://api:8000
    profiles: ["tunnel"]
    depends_on:
      api: { condition: service_healthy }

  locust:
    build: ./loadtest
    profiles: ["loadtest"]
    volumes: ["./loadtest:/mnt/locust"]
    working_dir: /mnt/locust
    environment:
      SCENARIO: ${SCENARIO:-steady}
      LOADTEST_PASSWORD: ${SEED_PASSWORD}
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "1", memory: 1G } } }

volumes:
  pgdata:
